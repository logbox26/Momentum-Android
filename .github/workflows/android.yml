name: Android CI Build & APK Assembly

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Gradle
        run: gradle -p android clean testDebugUnitTest assembleDebug --stacktrace

      - name: Verify Debug APK Exists
        run: |
          if ! compgen -G "android/app/build/outputs/apk/debug/*.apk" > /dev/null; then
            echo "ERROR: Debug APK was not generated in android/app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
